<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP-Harness · 角色扮演 Agent</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161a23; --panel2: #1d2330; --border: #2a3142;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #7c9cff; --user: #3b4256;
    --assistant: #1d2330; --ok: #4ade80; --err: #f87171; --card: #2c2a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; height: 100vh; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
  header .title { font-weight: 700; letter-spacing: 1px; }
  header .chip { font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--border); padding: 2px 10px; border-radius: 999px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 80%; padding: 11px 16px; border-radius: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; color: var(--dim); margin-bottom: 5px; opacity: .85; }
  .msg .meta .time { margin-left: 8px; opacity: .6; font-size: 10px; }
  .tools { align-self: flex-start; font-size: 12px; color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; }
  .tools span { background: var(--panel2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px; }
  .tools .ok { color: var(--ok); } .tools .err { color: var(--err); }
  .card-box { align-self: center; width: 92%; max-width: 560px; background: var(--card); border: 1px solid #4a4766; border-radius: 14px; padding: 16px; }
  .card-box .q { font-weight: 700; margin-bottom: 4px; }
  .card-box .r { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .card-box .opt { display: block; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; margin-top: 8px; cursor: pointer; font-size: 14px; }
  .card-box .opt:hover { border-color: var(--accent); }
  .card-box input[type=text] { width: 100%; margin-top: 8px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; }
  .warn { align-self: center; color: #fbbf24; font-size: 13px; }
  .composer { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--border); }
  .composer .row { display: flex; gap: 10px; }
  #quickCmd { display: flex; gap: 6px; flex-wrap: wrap; }
  #quickCmd button { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 12px; transition: all .15s; }
  #quickCmd button:hover { border-color: var(--accent); color: var(--text); }
  #input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; resize: none; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--accent); border: none; color: #0b0d12; font-weight: 700; border-radius: 10px; padding: 0 24px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #send.busy { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
  #send.busy::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .empty-tip { align-self: center; text-align: center; margin-top: 12vh; color: var(--dim); max-width: 420px; line-height: 1.8; }
  .empty-tip .big { font-size: 17px; color: var(--text); margin-bottom: 8px; }
  .empty-tip .cmd { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; margin: 2px; font-size: 12px; color: var(--text); }
  aside { width: 320px; border-left: 1px solid var(--border); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
  .sec { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .sec h3 { font-size: 13px; color: var(--dim); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .sec ul { list-style: none; font-size: 13px; line-height: 1.6; }
  .sec li { border-bottom: 1px dashed var(--border); padding: 4px 0; }
  .sec li:last-child { border-bottom: none; }
  .sec .label { color: var(--accent); margin-right: 6px; }
  #uploadBtn { width: 100%; background: var(--panel2); border: 1px dashed var(--border); color: var(--dim); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #uploadBtn:hover { border-color: var(--accent); color: var(--text); }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--dim); }
  .stat-row b { color: var(--text); font-weight: 600; }
  #summary { font-size: 12px; color: var(--dim); line-height: 1.6; max-height: 140px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <main>
    <header>
      <span class="title">✦ RP-Harness</span>
      <span class="chip" id="chipCard">角色：—</span>
      <span class="chip" id="chipModel">模型：—</span>
      <span class="chip" id="chipState">窗口 —/—</span>
      <button id="newBtn" title="清空当前对话，重新开场" style="margin-left:auto;background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:12px;">＋ 新建对话</button>
      <div style="position:relative;" id="exportWrap">
        <button id="exportBtn" title="导出本次对话" style="background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:12px;">⬇ 导出</button>
        <div id="exportMenu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:50;min-width:140px;">
          <button data-fmt="md" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;">📄 Markdown (.md)</button>
          <button data-fmt="doc" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;">📝 Word (.doc)</button>
        </div>
      </div>
    </header>
    <div id="messages">
      <div class="empty-tip" id="emptyTip">
        <div class="big">✦ 开始一段旅程</div>
        <div>直接对角色说话，或试试快捷命令：</div>
        <div style="margin-top:10px;">
          <span class="cmd">/state</span><span class="cmd">/lore 词</span><span class="cmd">/snap</span><span class="cmd">/back</span><span class="cmd">/phase</span><span class="cmd">/help</span>
        </div>
      </div>
    </div>
    <div class="composer">
      <div id="quickCmd">
        <button data-cmd="/state">/state 状态</button>
        <button data-cmd="/phase">/phase 主线</button>
        <button data-cmd="/lore ">/lore 查设定</button>
        <button data-cmd="/snap">/snap 存档</button>
        <button data-cmd="/back">/back 回档</button>
        <button data-cmd="/help">/help 帮助</button>
      </div>
      <div class="row">
        <textarea id="input" rows="2" placeholder="对角色说话… 回车发送｜回一个字也能继续（如：1 / 去 / 不）"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </main>
  <aside>
    <div class="sec">
      <h3>角色卡</h3>
      <input type="file" id="cardFile" accept=".json,.png" hidden>
      <button id="uploadBtn">⬆ 上传角色卡（SillyTavern JSON）</button>
    </div>
    <div class="sec">
      <h3>上下文统计</h3>
      <div class="stat-row"><span>预算</span><b id="stBudget">—</b></div>
      <div class="stat-row"><span>窗口 / 总回合</span><b id="stWindow">—</b></div>
      <div class="stat-row"><span>本回合工具</span><b id="stTools">—</b></div>
      <div class="stat-row"><span>本回合估算</span><b id="stTokens">—</b></div>
    </div>
    <div class="sec">
      <h3>主线进度</h3>
      <div id="mainline"><span style="color:var(--dim);font-size:13px">（加载中…）</span></div>
    </div>
    <div class="sec">
      <h3>人物册（群像）</h3>
      <div id="roster"><span style="color:var(--dim);font-size:13px">（还没有登记的角色）</span></div>
    </div>
    <div class="sec">
      <h3>前情提要（压缩摘要）</h3>
      <div id="summary">（暂无）</div>
    </div>
    <div class="sec">
      <h3>世界状态账本</h3>
      <div id="ledger"><span style="color:var(--dim);font-size:13px">（账本为空）</span></div>
    </div>
    <div class="sec">
      <h3>世界线存档</h3>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input id="snapLabel" placeholder="存档名（可选）" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;">
        <button id="snapBtn" style="background:var(--accent);border:none;color:#0b0d12;border-radius:6px;padding:0 12px;cursor:pointer;font-size:12px;">存</button>
      </div>
      <ul id="snapList" style="max-height:180px;overflow-y:auto;"></ul>
    </div>
  </aside>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const els = { messages: $("messages"), input: $("input"), send: $("send"), cardFile: $("cardFile"), uploadBtn: $("uploadBtn") };
const LEDGER_LABEL = { characters: "人物", items: "物品", relations: "关系", plots: "伏笔", notes: "备注" };
let busy = false;
let cardEl = null; // 正在等待选择的决策卡 DOM
let streamingBubble = null; // 当前正在流式填充的正文气泡

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = role === "user" ? "你" : "剧情";
  const now = new Date();
  const ts = document.createElement("span");
  ts.className = "time";
  ts.textContent = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  meta.appendChild(ts);
  div.appendChild(meta);
  const body = document.createElement("div");
  body.textContent = text;
  div.appendChild(body);
  els.messages.appendChild(div);
  hideEmptyTip();
  scrollDown();
  return body;
}
function scrollDown() { els.messages.scrollTop = els.messages.scrollHeight; }
function hideEmptyTip() {
  const t = $("emptyTip");
  if (t) t.style.display = "none";
}

function addTools(tools) {
  if (!tools || !tools.length) return;
  const row = document.createElement("div");
  row.className = "tools";
  for (const t of tools) {
    const s = document.createElement("span");
    s.className = t.ok ? "ok" : "err";
    s.textContent = `⚙ ${t.name} ${t.ok ? "✓" : "✗"}`;
    s.title = t.args + "\n→ " + t.output;
    row.appendChild(s);
  }
  els.messages.appendChild(row);
  scrollDown();
}

function renderCard(card) {
  const box = document.createElement("div");
  box.className = "card-box";
  const q = document.createElement("div"); q.className = "q"; q.textContent = "✦ 决策卡：" + card.question;
  box.appendChild(q);
  if (card.reason) { const r = document.createElement("div"); r.className = "r"; r.textContent = card.reason; box.appendChild(r); }
  card.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = `${i + 1}. ${opt}`;
    b.onclick = () => { sendChoice(opt); box.remove(); };
    box.appendChild(b);
  });
  if (card.allowFreeInput) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "或输入你自己的走向…（回车确认）";
    input.onkeydown = (e) => { if (e.key === "Enter" && input.value.trim()) { sendChoice(input.value.trim()); box.remove(); } };
    box.appendChild(input);
  }
  els.messages.appendChild(box);
  cardEl = box;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  const hint = document.createElement("div");
  hint.className = "warn";
  hint.id = "cardHint";
  hint.textContent = "✦ 剧情在等你拍板：在卡片上选择，或直接在输入框输入你的走向";
  els.messages.appendChild(hint);
  scrollDown();
}
function sendChoice(text) {
  wsSend({ type: "choice", text });
  clearCard();
}
function clearCard() {
  if (cardEl) { cardEl.remove(); cardEl = null; }
  const h = $("cardHint");
  if (h) h.remove();
}

function renderLedger(ledger) {
  const box = $("ledger");
  box.innerHTML = "";
  let any = false;
  for (const [sec, label] of Object.entries(LEDGER_LABEL)) {
    const items = ledger[sec] || [];
    if (!items.length) continue;
    any = true;
    const h = document.createElement("h3");
    h.style.cssText = "font-size:13px;color:var(--dim);margin:8px 0 4px;";
    h.textContent = label + "（" + items.length + "）";
    box.appendChild(h);
    const ul = document.createElement("ul");
    for (const it of items.slice(-8).reverse()) {
      const li = document.createElement("li");
      const { key, ...rest } = it;
      const desc = Object.entries(rest).filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => `${k}：${typeof v === "object" ? JSON.stringify(v) : v}`).join("，");
      li.innerHTML = `<span class="label">${key || "•"}</span>${esc(desc || "(空)")}`;
      ul.appendChild(li);
    }
    box.appendChild(ul);
  }
  if (!any) box.innerHTML = '<span style="color:var(--dim);font-size:13px">（账本为空）</span>';
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function renderState(st) {
  $("chipCard").textContent = "角色：" + (st.cardName || "—");
  $("chipModel").textContent = "模型：" + st.model;
  $("chipState").textContent = `窗口 ${st.windowTurns}/${st.totalTurns}`;
  $("stBudget").textContent = Math.round(st.budgetChars / 1000) + "k 字符";
  $("stWindow").textContent = `${st.windowTurns} / ${st.totalTurns}`;
  $("summary").textContent = st.summary || "（暂无）";
  renderLedger(st.ledger);
  renderMainline(st.mainline);
  renderRoster(st.ledger.characters || []);
}

/** 人物册：把账本 characters 渲染成群像卡（状态高亮，呼应群像叙事） */
function renderRoster(characters) {
  const box = $("roster");
  if (!characters.length) { box.innerHTML = '<span style="color:var(--dim);font-size:13px">（还没有登记的角色）</span>'; return; }
  let html = "";
  for (const c of characters.slice(-12).reverse()) {
    const { key, name, ...rest } = c;
    const status = rest.status || rest["状态"] || "";
    const desc = Object.entries(rest).filter(([k, v]) => k !== "status" && k !== "状态" && v !== undefined && v !== null && v !== "")
      .map(([k, v]) => `${k}：${typeof v === "object" ? JSON.stringify(v) : v}`).join("，").slice(0, 60);
    const badge = status ? `<span style="color:var(--ok);font-size:11px;margin-left:6px;">${esc(status)}</span>` : "";
    html += `<div style="background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;margin-bottom:6px;">`
      + `<div style="font-size:13px;font-weight:700;">${esc(key || name || "?")}${badge}</div>`
      + (desc ? `<div style="font-size:11px;color:var(--dim);margin-top:2px;">${esc(desc)}</div>` : "")
      + `</div>`;
  }
  box.innerHTML = html;
}

function renderMainline(m) {
  const box = $("mainline");
  if (!m || !m.title) { box.innerHTML = '<span style="color:var(--dim);font-size:13px">（无主线）</span>'; return; }
  let html = `<div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;">${esc(m.title)}</div>`;
  html += '<ul style="font-size:12px;line-height:1.7;">' + (m.objectives || []).map(o => `<li>· ${esc(o)}</li>`).join("") + '</ul>';
  box.innerHTML = html;
}

/** 初始渲染历史消息（刷新/回档后恢复对话） */
function renderHistory(turns) {
  for (const t of turns || []) {
    if (t.user) addMsg("user", t.user);
    for (const m of t.messages || []) {
      if (m.role === "assistant" && m.content) addMsg("assistant", m.content);
    }
  }
}

async function loadSnapshots() {
  const list = await (await fetch("/api/snapshots")).json();
  const ul = $("snapList");
  ul.innerHTML = "";
  if (!list.length) { ul.innerHTML = '<li style="color:var(--dim)">（暂无存档）</li>'; return; }
  for (const s of list) {
    const li = document.createElement("li");
    li.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:6px;";
    const info = document.createElement("span");
    info.textContent = (s.label ? s.label + " · " : "") + new Date(s.at).toLocaleString();
    info.style.cssText = "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
    const btn = document.createElement("button");
    btn.textContent = "回档";
    btn.style.cssText = "background:var(--accent);border:none;color:#0b0d12;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px;";
    btn.onclick = async () => {
      if (!confirm("回档到「" + (s.label || new Date(s.at).toLocaleString()) + "」？当前进度会先自动存档。")) return;
      const res = await fetch("/api/restore", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: s.id }) });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "回档失败"); return; }
      location.reload();
    };
    li.appendChild(info); li.appendChild(btn);
    ul.appendChild(li);
  }
}
async function saveSnapshot() {
  const label = $("snapLabel").value.trim();
  const res = await fetch("/api/snapshot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ label }) });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "存档失败"); return; }
  $("snapLabel").value = "";
  loadSnapshots();
}

/* ─────────── WebSocket ─────────── */
let ws = null;
function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

let interrupted = false;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => {
    $("chipState").textContent = "已连接";
    if (interrupted) {
      interrupted = false;
      const w = document.createElement("div");
      w.className = "warn";
      w.textContent = "⚠ 连接已重连：若上一条回复被中断，请重发或输入『继续』";
      els.messages.appendChild(w);
      scrollDown();
    }
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "init") { renderState(msg.state); renderHistory(msg.state.turns || []); loadSnapshots(); }
    if (msg.type === "delta") {
      if (!streamingBubble) streamingBubble = addMsg("assistant", "");
      streamingBubble.textContent += msg.text;
      scrollDown();
    }
    if (msg.type === "turn_done") {
      busy = false; streamingBubble = null; els.send.disabled = false; els.input.disabled = false;
      els.send.classList.remove("busy");
      els.send.textContent = "发送";
      addTools(msg.stats.tools);
      if (msg.stats.decisions && msg.stats.decisions.length) {
        $("stTools").textContent = "决策卡 ×" + msg.stats.decisions.length;
      } else {
        $("stTools").textContent = msg.stats.tools.length ? `工具 ${msg.stats.tools.length} 次` : "无";
      }
      $("stTokens").textContent = msg.stats.estTokens ? `≈ ${msg.stats.estTokens} token` : "—";
    }
    if (msg.type === "card") renderCard(msg.card);
    if (msg.type === "state") renderState(msg.state);
    if (msg.type === "notice") {
      const n = document.createElement("div");
      n.className = "warn";
      n.style.cssText = "white-space:pre-wrap;align-self:center;max-width:85%;";
      n.textContent = "⚙ " + msg.text;
      els.messages.appendChild(n);
      scrollDown();
    }
    if (msg.type === "reload") { location.reload(); }
    if (msg.type === "warn") { const w = document.createElement("div"); w.className = "warn"; w.textContent = msg.message; els.messages.appendChild(w); scrollDown(); }
    if (msg.type === "error") {
      busy = false; streamingBubble = null; els.send.disabled = false; els.input.disabled = false;
      els.send.classList.remove("busy");
      els.send.textContent = "发送";
      const w = document.createElement("div"); w.className = "warn"; w.textContent = "⚠ " + msg.message; els.messages.appendChild(w); scrollDown();
    }
  };
  ws.onclose = () => {
    if (busy) interrupted = true;
    busy = false; els.send.disabled = false; els.input.disabled = false;
    setTimeout(connect, 1500);
  };
}

async function sendChat() {
  const text = els.input.value.trim();
  if (!text) return;
  // 决策卡挂起时：普通输入当作自由选择（防止"没人点卡片 → 对话卡死"）
  if (cardEl) {
    wsSend({ type: "choice", text });
    clearCard();
    els.input.value = "";
    return;
  }
  if (busy) return;
  // 斜杠命令：不占用剧情回合，只发命令
  if (text.startsWith("/")) {
    els.input.value = "";
    wsSend({ type: "command", text });
    return;
  }
  busy = true; els.send.disabled = true;
  els.send.classList.add("busy");
  els.send.textContent = "生成中";
  els.input.value = "";
  addMsg("user", text);
  wsSend({ type: "chat", text });
}

els.send.onclick = sendChat;
els.input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });

// 快捷命令栏：点击即发命令
for (const btn of document.querySelectorAll("#quickCmd button")) {
  btn.onclick = () => {
    const cmd = btn.dataset.cmd || "";
    if (cmd === "/lore ") {
      // /lore 需要参数：把命令填入输入框，让玩家补关键词
      els.input.value = "/lore ";
      els.input.focus();
      return;
    }
    if (busy) return;
    wsSend({ type: "command", text: cmd });
  };
}

els.uploadBtn.onclick = () => els.cardFile.click();
$("snapBtn").onclick = saveSnapshot;

// 导出菜单：点击下载 md/doc
const exportBtn = $("exportBtn");
const exportMenu = $("exportMenu");
exportBtn.onclick = (e) => { e.stopPropagation(); exportMenu.style.display = exportMenu.style.display === "none" ? "block" : "none"; };
document.addEventListener("click", () => { exportMenu.style.display = "none"; });
for (const b of exportMenu.querySelectorAll("button")) {
  b.onclick = async () => {
    const fmt = b.dataset.fmt || "md";
    exportMenu.style.display = "none";
    try {
      const res = await fetch(`/api/export?fmt=${fmt}`);
      if (!res.ok) { alert("导出失败"); return; }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fmt === "md" ? "rp-dialog.md" : "rp-dialog.doc";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    } catch { alert("导出失败"); }
  };
}
$("newBtn").onclick = () => {
  if (!confirm("新建对话？当前剧情、账本与主线进度将被清空（角色卡保留）。建议先存档。")) return;
  wsSend({ type: "command", text: "/new" });
};
els.cardFile.onchange = async () => {
  const f = els.cardFile.files[0];
  if (!f) return;
  let body;
  if (/\.png$/i.test(f.name)) {
    const buf = await f.arrayBuffer();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
    body = JSON.stringify({ pngBase64: b64 });
  } else {
    body = await f.text();
  }
  const res = await fetch("/api/card", { method: "POST", headers: { "Content-Type": "application/json" }, body });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "导入失败"); return; }
  els.messages.innerHTML = "";
  if (data.firstMes) addMsg("assistant", data.firstMes);
  const st = await (await fetch("/api/state")).json();
  renderState(st);
  $("chipCard").textContent = "角色：" + data.name;
};
connect();
</script>
</body>
</html>
