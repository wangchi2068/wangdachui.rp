<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wangdachui.pi · 角色扮演 Agent</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161a23; --panel2: #1d2330; --border: #2a3142;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #7c9cff; --user: #3b4256;
    --assistant: #1d2330; --ok: #4ade80; --err: #f87171; --card: #2c2a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; height: 100vh; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
  header .title { font-weight: 700; letter-spacing: 1px; }
  header .chip { font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--border); padding: 2px 10px; border-radius: 999px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 80%; padding: 11px 16px; border-radius: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; color: var(--dim); margin-bottom: 5px; opacity: .85; }
  .msg .meta .time { margin-left: 8px; opacity: .6; font-size: 10px; }
  .tools { align-self: flex-start; font-size: 12px; color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; }
  .tools span { background: var(--panel2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px; }
  .tools .ok { color: var(--ok); } .tools .err { color: var(--err); }
  .tools-detail {
    flex-basis: 100%; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto;
    font-family: Consolas, monospace; color: var(--dim);
  }
  .card-box { align-self: center; width: 92%; max-width: 560px; background: var(--card); border: 1px solid #4a4766; border-radius: 14px; padding: 16px; }
  .card-box .q { font-weight: 700; margin-bottom: 4px; }
  .card-box .r { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .card-box .opt { display: block; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; margin-top: 8px; cursor: pointer; font-size: 14px; }
  .card-box .opt:hover { border-color: var(--accent); }
  .card-box input[type=text] { width: 100%; margin-top: 8px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; }
  .warn { align-self: center; color: #fbbf24; font-size: 13px; }
  .composer { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--border); }
  .composer .row { display: flex; gap: 10px; }
  #quickCmd { display: flex; gap: 6px; flex-wrap: wrap; }
  #quickCmd button { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 12px; transition: all .15s; }
  #quickCmd button:hover { border-color: var(--accent); color: var(--text); }
  #input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; resize: none; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--accent); border: none; color: #0b0d12; font-weight: 700; border-radius: 10px; padding: 0 24px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #send.busy { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
  #send.busy::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .empty-tip { align-self: center; text-align: center; margin-top: 12vh; color: var(--dim); max-width: 420px; line-height: 1.8; }
  .empty-tip .big { font-size: 17px; color: var(--text); margin-bottom: 8px; }
  .empty-tip .cmd { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; margin: 2px; font-size: 12px; color: var(--text); }
  aside { width: 320px; border-left: 1px solid var(--border); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
  .sec { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .sec h3 { font-size: 13px; color: var(--dim); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .sec ul { list-style: none; font-size: 13px; line-height: 1.6; }
  .sec li { border-bottom: 1px dashed var(--border); padding: 4px 0; }
  .sec li:last-child { border-bottom: none; }
  .sec .label { color: var(--accent); margin-right: 6px; }
  #uploadBtn { width: 100%; background: var(--panel2); border: 1px dashed var(--border); color: var(--dim); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #uploadBtn:hover { border-color: var(--accent); color: var(--text); }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--dim); }
  .stat-row b { color: var(--text); font-weight: 600; }
  #summary { font-size: 12px; color: var(--dim); line-height: 1.6; max-height: 140px; overflow-y: auto; white-space: pre-wrap; }

  /* ===== 沉浸动效 ===== */
  /* 消息入场：从黑暗中浮现 */
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg { animation: msgIn .28s ease; }
  .card-box, .roll-box { animation: msgIn .28s ease; }
  /* 用户/剧情小徽标 */
  .msg { position: relative; }
  .msg .badge {
    position: absolute; top: -9px; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border: 2px solid var(--bg);
  }
  .msg.user .badge { right: 10px; background: var(--user); color: var(--dim); }
  .msg.assistant .badge { left: 10px; background: var(--assistant); color: var(--accent); }
  /* 打字指示器：三点跳动 */
  .msg.typing { max-width: 90px; padding: 14px 18px; }
  .dots { display: flex; gap: 5px; align-items: center; justify-content: center; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: dotBlink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dotBlink { 0%,80%,100% { opacity: .2; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.1); } }
  /* 回到底部药丸 */
  #scrollToBottom {
    position: fixed; right: 18px; bottom: 96px; z-index: 40;
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; transition: opacity .2s;
  }
  #scrollToBottom:hover { color: var(--text); border-color: var(--accent); }
  @media (max-width: 768px) { #scrollToBottom { bottom: 110px; right: 12px; } }

  /* ===== 掷骰卡（BG3 式玩家投掷） ===== */  .roll-box { align-self: center; width: 92%; max-width: 420px; background: var(--card); border: 1px solid #4a4766; border-radius: 14px; padding: 18px; text-align: center; }
  .roll-box .rq { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .roll-box .rr { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  .roll-math { font-size: 14px; color: var(--dim); margin-bottom: 14px; letter-spacing: .5px; }
  .roll-math b { color: var(--text); }
  /* 骰子本体 */
  .dice { width: 72px; height: 72px; margin: 0 auto 14px; position: relative; }
  .dice .face {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #fff; border-radius: 14px;
    background: linear-gradient(145deg, #4a4f68, #2c3148); border: 2px solid #5a6080;
    box-shadow: 0 6px 18px rgba(0,0,0,.4); user-select: none;
  }
  .dice.rolling .face { animation: diceRoll .9s cubic-bezier(.3,.7,.4,1) infinite; }
  @keyframes diceRoll {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(90deg) scale(1.12); }
    50% { transform: rotate(180deg) scale(.95); }
    75% { transform: rotate(270deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .dice .face.big { font-size: 44px; }
  .dice .face.good { background: linear-gradient(145deg, #2f6b4a, #1d4a33); border-color: #4ade80; }
  .dice .face.bad { background: linear-gradient(145deg, #7a3030, #4a1d1d); border-color: #f87171; }
  /* 落地回弹 + 辉光 */
  .dice .face.impact { animation: diceImpact .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes diceImpact {
    0% { transform: scale(1.3); box-shadow: 0 0 24px var(--accent); }
    60% { transform: scale(.94); }
    100% { transform: scale(1); }
  }
  .dice .face.good.impact { animation-name: diceImpactGood; }
  .dice .face.bad.impact { animation-name: diceImpactBad; }
  @keyframes diceImpactGood { 0% { transform: scale(1.35); box-shadow: 0 0 30px #4ade80; } 60% { transform: scale(.94); } 100% { transform: scale(1); } }
  @keyframes diceImpactBad { 0% { transform: scale(1.35); box-shadow: 0 0 30px #f87171; } 60% { transform: scale(.94); } 100% { transform: scale(1); } }
  /* crit 震屏 */
  #messages.shake { animation: screenShake .3s ease; }
  @keyframes screenShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
  }
  /* 结果行 */
  .roll-result { font-size: 15px; font-weight: 600; margin-top: 6px; min-height: 24px; }
  .roll-result .succ { color: var(--ok); }
  .roll-result .fail { color: var(--err); }
  /* 投掷按钮 */
  #rollBtn {
    margin-top: 14px; background: var(--accent); border: none; color: #0b0d12;
    font-weight: 700; border-radius: 10px; padding: 12px 32px; cursor: pointer; font-size: 15px;
    min-height: 46px; width: 100%; max-width: 240px; transition: opacity .15s;
  }
  #rollBtn:disabled { opacity: .5; cursor: not-allowed; }
  .roll-note { font-size: 12px; color: var(--dim); margin-top: 8px; }

  /* ===== 移动端适配（诡秘之主 / 裂界 共用） ===== */
  @media (max-width: 768px) {
    body { height: 100dvh; overflow: hidden; }
    #app { flex-direction: column; }
    main { flex: 1; min-height: 0; }
    /* 顶栏：窄屏下紧凑，标题省略、chips 只留角色 */
    header { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
    header .title { font-size: 13px; }
    header .chip { font-size: 11px; padding: 2px 8px; }
    #chipModel, #chipState { display: none; } /* 手机只留角色 chip，省空间 */
    #newBtn { padding: 6px 10px; font-size: 12px; }
    #exportBtn { padding: 6px 10px; font-size: 12px; }
    /* 消息区：窄屏全宽 */
    #messages { padding: 12px 10px; gap: 10px; }
    .msg { max-width: 100%; font-size: 15px; padding: 10px 13px; line-height: 1.75; }
    .card-box { width: 100%; max-width: 100%; padding: 14px 12px; }
    .card-box .opt { padding: 12px 14px; font-size: 15px; margin-top: 10px; border-radius: 10px; }
    .card-box input[type=text] { padding: 11px 14px; font-size: 15px; }
    .roll-box { width: 100%; max-width: 100%; padding: 16px 14px; }
    .dice { width: 62px; height: 62px; }
    .dice .face { font-size: 28px; }
    .dice .face.big { font-size: 38px; }
    #rollBtn { max-width: 100%; min-height: 48px; }
    .warn { font-size: 13px; }
    /* 输入区：触控友好 */
    .composer { padding: 8px 10px 10px; gap: 6px; }
    .composer .row { gap: 8px; }
    #input { font-size: 16px; padding: 12px 14px; min-height: 44px; } /* 16px 防 iOS 聚焦缩放 */
    #send { min-width: 72px; min-height: 44px; font-size: 15px; padding: 0 16px; }
    #quickCmd { gap: 5px; }
    #quickCmd button { padding: 6px 10px; font-size: 12px; }
    /* 侧栏：手机上收起为底部抽屉（点“状态”按钮展开） */
    aside {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      width: 100%; max-height: 55dvh; border-left: none; border-top: 1px solid var(--border);
      transform: translateY(100%); transition: transform .25s ease;
      z-index: 60; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.5);
      overflow-y: auto;
    }
    aside.open { transform: translateY(0); }
    /* 抽屉拉手 */
    aside::before {
      content: ""; display: block; width: 44px; height: 4px; border-radius: 999px;
      background: var(--border); margin: 6px auto 2px;
    }
    /* 顶栏加“状态”按钮（手机上展开侧栏） */
    #asideToggle {
      display: inline-block !important;
      background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px;
    }
    /* 点暗层关抽屉 */
    .aside-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; }
    .aside-mask.show { display: block; }
    .empty-tip { margin-top: 8vh; font-size: 14px; }
  }
  /* 桌面默认隐藏“状态”按钮和遮罩 */
  #asideToggle { display: none; }
  .aside-mask { display: none; }
</style>
</head>
<body>
<div id="app">
  <main>
    <header>
      <span class="title">✦ wangdachui.pi</span>
      <span class="chip" id="chipCard">角色：—</span>
      <span class="chip" id="chipModel">模型：—</span>
      <span class="chip" id="chipState">窗口 —/—</span>
      <button id="newBtn" title="清空当前对话，重新开场" style="margin-left:auto;background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:12px;">＋ 新建对话</button>
      <button id="asideToggle" title="状态面板">☰ 状态</button>
      <div style="position:relative;" id="exportWrap">
        <button id="exportBtn" title="导出本次对话" style="background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:12px;">⬇ 导出</button>
        <div id="exportMenu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:50;min-width:140px;">
          <button data-fmt="md" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;">📄 Markdown (.md)</button>
          <button data-fmt="doc" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;">📝 Word (.doc)</button>
        </div>
      </div>
    </header>
    <div id="ctxBarWrap" style="height:3px;background:transparent;"><div id="ctxBar" style="height:100%;width:0%;background:var(--accent);transition:width .4s;"></div></div>
    <div id="messages">
      <div class="empty-tip" id="emptyTip">
        <div class="big">✦ 开始一段旅程</div>
        <div>直接对角色说话，或试试快捷命令：</div>
        <div style="margin-top:10px;">
          <span class="cmd">/state</span><span class="cmd">/lore 词</span><span class="cmd">/snap</span><span class="cmd">/back</span><span class="cmd">/phase</span><span class="cmd">/help</span>
        </div>
      </div>
    </div>
    <button id="scrollToBottom" onclick="smartScroll();">↓ 回到底部</button>
    <div class="composer">
      <div id="quickCmd">
        <button data-cmd="/state">/state 状态</button>
        <button data-cmd="/phase">/phase 主线</button>
        <button data-cmd="/lore ">/lore 查设定</button>
        <button data-cmd="/snap">/snap 存档</button>
        <button data-cmd="/back">/back 回档</button>
        <button data-cmd="/help">/help 帮助</button>
      </div>
      <div class="row">
        <textarea id="input" rows="2" placeholder="对角色说话… 回车发送｜回一个字也能继续（如：1 / 去 / 不）"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </main>
  <aside>
    <div class="sec">
      <h3>角色卡</h3>
      <input type="file" id="cardFile" accept=".json,.png" hidden>
      <button id="uploadBtn">⬆ 上传角色卡（SillyTavern JSON）</button>
    </div>
    <div class="sec">
      <h3>上下文统计</h3>
      <div class="stat-row"><span>预算</span><b id="stBudget">—</b></div>
      <div class="stat-row"><span>窗口 / 总回合</span><b id="stWindow">—</b></div>
      <div class="stat-row"><span>本回合工具</span><b id="stTools">—</b></div>
      <div class="stat-row"><span>本回合估算</span><b id="stTokens">—</b></div>
    </div>
    <div class="sec">
      <h3>主线进度</h3>
      <div id="mainline"><span style="color:var(--dim);font-size:13px">（加载中…）</span></div>
    </div>
    <div class="sec">
      <h3>人物册（群像）</h3>
      <div id="roster"><span style="color:var(--dim);font-size:13px">（还没有登记的角色）</span></div>
    </div>
    <div class="sec">
      <h3>前情提要（压缩摘要）</h3>
      <div id="summary">（暂无）</div>
    </div>
    <div class="sec">
      <h3>世界状态账本</h3>
      <div id="ledger"><span style="color:var(--dim);font-size:13px">（账本为空）</span></div>
    </div>
    <div class="sec">
      <h3>世界线存档</h3>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input id="snapLabel" placeholder="存档名（可选）" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;">
        <button id="snapBtn" style="background:var(--accent);border:none;color:#0b0d12;border-radius:6px;padding:0 12px;cursor:pointer;font-size:12px;">存</button>
      </div>
      <ul id="snapList" style="max-height:180px;overflow-y:auto;"></ul>
    </div>
  </aside>
  <div class="aside-mask" id="asideMask"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const els = { messages: $("messages"), input: $("input"), send: $("send"), cardFile: $("cardFile"), uploadBtn: $("uploadBtn") };

// 移动端侧栏抽屉开关
const aside = document.querySelector("aside");
const asideToggle = $("asideToggle");
const asideMask = $("asideMask");
function openAside() { aside?.classList.add("open"); asideMask?.classList.add("show"); }
function closeAside() { aside?.classList.remove("open"); asideMask?.classList.remove("show"); }
asideToggle?.addEventListener("click", () => aside?.classList.contains("open") ? closeAside() : openAside());
asideMask?.addEventListener("click", closeAside);
const LEDGER_LABEL = { characters: "人物", items: "物品", relations: "关系", plots: "伏笔", notes: "备注" };
let busy = false;
let cardEl = null; // 正在等待选择的决策卡 DOM
let streamingBubble = null; // 当前正在流式填充的正文气泡
function clearTyping() {
  const t = document.querySelector(".msg.typing");
  if (t) t.remove();
}
function resetSendBtn() {
  busy = false; streamingBubble = null; clearTyping();
  if (wsTurnTimer) { clearTimeout(wsTurnTimer); wsTurnTimer = null; }
  els.send.disabled = false; els.input.disabled = false;
  els.send.classList.remove("busy");
  els.send.textContent = "发送";
  els.send.style.color = "";
  els.send.style.border = "";
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const badge = document.createElement("div");
  badge.className = "badge";
  badge.textContent = role === "user" ? "你" : "✦";
  div.appendChild(badge);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = role === "user" ? "你" : "剧情";
  const now = new Date();
  const ts = document.createElement("span");
  ts.className = "time";
  ts.textContent = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  meta.appendChild(ts);
  div.appendChild(meta);
  const body = document.createElement("div");
  body.textContent = text;
  div.appendChild(body);
  els.messages.appendChild(div);
  hideEmptyTip();
  scrollDown();
  return body;
}
function scrollDown() { els.messages.scrollTo({ top: els.messages.scrollHeight, behavior: "smooth" }); }
function hideEmptyTip() {
  const t = $("emptyTip");
  if (t) t.style.display = "none";
}

/* 智能滚动：流式期间只在接近底部时跟随，回读上文不被拽走；否则显示回底药丸 */
let nearBottom = true;
let lastScrollAuto = 0;
els.messages.addEventListener("scroll", () => {
  const el = els.messages;
  nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const btn = $("scrollToBottom");
  if (btn) btn.style.display = nearBottom ? "none" : "block";
});
function smartScroll() {
  const el = els.messages;
  const now = Date.now();
  if (!nearBottom || now - lastScrollAuto < 150) return;
  lastScrollAuto = now;
  el.scrollTo({ top: el.scrollHeight, behavior: "smooth" });
}

function addTools(tools) {
  if (!tools || !tools.length) return;
  const row = document.createElement("div");
  row.className = "tools";
  for (const t of tools) {
    const s = document.createElement("span");
    s.className = t.ok ? "ok" : "err";
    s.textContent = (t.ok ? "⚙ " : "⚠ ⚙ ") + t.name + (t.ok ? " ✓" : " ✗");
    s.style.cursor = "pointer";
    s.title = "点击查看详情";
    s.onclick = () => {
      // 展开/收起该工具详情
      const existing = s.nextElementSibling;
      if (existing && existing.classList.contains("tools-detail")) { existing.remove(); return; }
      const pre = document.createElement("pre");
      pre.className = "tools-detail";
      pre.textContent = `⚙ ${t.name}\n参数：${t.args || "(无)"}\n→ ${t.output || "(空)"}`;
      s.insertAdjacentElement("afterend", pre);
    };
    row.appendChild(s);
  }
  els.messages.appendChild(row);
  scrollDown();
}

function renderCard(card) {
  const box = document.createElement("div");
  box.className = "card-box";
  const q = document.createElement("div"); q.className = "q"; q.textContent = "✦ 决策卡：" + card.question;
  box.appendChild(q);
  if (card.reason) { const r = document.createElement("div"); r.className = "r"; r.textContent = card.reason; box.appendChild(r); }
  const btns = [];
  card.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = `${i + 1}. ${opt}`;
    b.onclick = () => { sendChoice(opt); box.remove(); };
    box.appendChild(b);
    btns.push(b);
  });
  if (card.allowFreeInput) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "或输入你自己的走向…（回车确认）";
    input.onkeydown = (e) => { if (e.key === "Enter" && input.value.trim()) { sendChoice(input.value.trim()); box.remove(); } };
    box.appendChild(input);
  }
  // 数字快捷键：1-9 直接选对应选项（BG3/CRPG 惯例）
  box.tabIndex = 0;
  box.addEventListener("keydown", (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= btns.length) {
      e.preventDefault();
      btns[n - 1].click();
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      const idx = btns.indexOf(document.activeElement);
      const next = e.key === "ArrowDown" ? (idx + 1) % btns.length : (idx - 1 + btns.length) % btns.length;
      btns[next].focus();
    }
  });
  els.messages.appendChild(box);
  cardEl = box;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  box.focus();
  const hint = document.createElement("div");
  hint.className = "warn";
  hint.id = "cardHint";
  hint.textContent = "✦ 剧情在等你拍板：按 1-9 或点击选项，或直接在输入框输入你的走向";
  els.messages.appendChild(hint);
  scrollDown();
}
function sendChoice(text) {
  wsSend({ type: "choice", text });
  clearCard();
}
function clearCard() {
  if (cardEl) { cardEl.remove(); cardEl = null; }
  const h = $("cardHint");
  if (h) h.remove();
}

/* ===== BG3 式玩家掷骰 ===== */
let rollEl = null; // 当前掷骰卡 DOM
let rollResolve = null; // 收到结果的回调（骰子动画结束后触发）

function renderRollCard(card) {
  const box = document.createElement("div");
  box.className = "roll-box";
  const modStr = card.mod >= 0 ? "+" + card.mod : String(card.mod);
  const labelSafe = esc(String(card.label ?? "检定"));
  box.innerHTML =
    `<div class="rq">🎲 检定 · ${labelSafe}</div>` +
    `<div class="rr">行动成败在此一掷</div>` +
    `<div class="roll-math">D20 <b>${modStr}</b> vs <b>DC${card.dc}</b></div>` +
    `<div class="dice"><div class="face">?</div></div>` +
    `<div class="roll-result"></div>` +
    `<button id="rollBtn">🎲 投掷 D20</button>` +
    `<div class="roll-note">点击投掷，让骰子替你决定</div>`;
  els.messages.appendChild(box);
  rollEl = box;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  const btn = box.querySelector("#rollBtn");
  btn.onclick = () => {

    btn.textContent = "🎲 投掷中…";
    const face = box.querySelector(".dice .face");
    const dice = box.querySelector(".dice");
    dice.classList.add("rolling");
    face.textContent = "?";
    // 骰子数字轮播（投掷感）+ 弹跳，收到结果时停轮播显真值
    const spin = setInterval(() => { face.textContent = 1 + Math.floor(Math.random() * 20); }, 80);
    box._rollSpin = spin;
    wsSend({ type: "roll" });
  };
}

// 服务端推送真随机结果：停轮播、显示点数、落地辉光、crit 震屏
function onRollResult(result) {
  if (!rollEl) return;
  const face = rollEl.querySelector(".dice .face");
  const dice = rollEl.querySelector(".dice");
  const res = rollEl.querySelector(".roll-result");
  const btn = rollEl.querySelector("#rollBtn");
  // 停轮播 + 停滚动动画
  if (rollEl._rollSpin) { clearInterval(rollEl._rollSpin); rollEl._rollSpin = null; }
  dice.classList.remove("rolling");
  face.textContent = result.die;
  face.classList.remove("big", "good", "bad", "impact");
  if (result.die === 20) face.classList.add("big", "good");
  else if (result.die === 1) face.classList.add("big", "bad");
  else if (result.success) face.classList.add("good");
  else face.classList.add("bad");
  // 落地回弹 + 辉光（CSS impact）
  void face.offsetWidth; // 强制重排以重播动画
  face.classList.add("impact");
  // 大成功/大失败震屏
  if (result.die === 20 || result.die === 1) {
    els.messages.classList.add("shake");
    setTimeout(() => els.messages.classList.remove("shake"), 300);
  }
  const modStr = result.mod >= 0 ? "+" + result.mod : String(result.mod);
  res.innerHTML = `D20(${result.die})${modStr} = <b>${result.total}</b> vs DC${result.dc} → ` +
    (result.success ? `<span class="succ">✓ 成功</span>` : `<span class="fail">✗ 失败</span>`);
  btn.disabled = false;
  btn.textContent = "✓ 结果已定，继续";
  btn.onclick = () => { boxRemoved(rollEl); };
}
function boxRemoved(box) {
  if (rollEl === box) rollEl = null;
  box.remove();
}

/* ─────────── WebSocket ─────────── */
let ws = null;
function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

/* ===== HTTP 对话兜底（Vercel 无持久 WS 时自动切换） ===== */
let httpMode = false;
let wsTurnTimer = null; // WS 回合超时检测
function setHttpMode(on) {
  httpMode = on;
  $("chipState").textContent = on ? "HTTP 模式" : "已连接";
  if (on) {
    const w = document.createElement("div");
    w.className = "warn";
    w.textContent = "⚠ 已切换 HTTP 模式：可正常对话，但决策卡/掷骰自动默认选择，打字机效果关闭";
    els.messages.appendChild(w);
    scrollDown();
  }
}
/** HTTP 版发消息：返回 {ok, content} */
async function httpSend(obj) {
  try {
    const r = await fetch("/api/chat?sid=" + encodeURIComponent(getSid()), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj),
    });
    const data = await r.json();
    return data;
  } catch { return { ok: false, error: "网络错误" }; }
}
/** HTTP 版刷新 state（轮询） */
async function httpPollState() {
  try {
    const r = await fetch("/api/state?sid=" + encodeURIComponent(getSid()));
    const st = await r.json();
    renderState(st);
    if (st.turns && st.turns.length) renderHistory(st.turns);
  } catch {}
}

let interrupted = false;
let reconnectFailures = 0;
/** 会话 ID：localStorage 持久化（每个浏览器一个稳定 ID），服务端按它隔离游戏状态 */
function getSid() {
  let sid = localStorage.getItem("wd_sid");
  if (!sid) {
    sid = "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("wd_sid", sid);
  }
  return sid;
}
function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host + "/ws?sid=" + encodeURIComponent(getSid()));
  ws.onopen = () => {
    $("chipState").textContent = "已连接";
    if (interrupted) {
      interrupted = false;
      const w = document.createElement("div");
      w.className = "warn";
      w.textContent = "⚠ 连接已重连：若上一条回复被中断，请重发或输入『继续』";
      els.messages.appendChild(w);
      scrollDown();
    }
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "init") { renderState(msg.state); renderHistory(msg.state.turns || []); loadSnapshots(); }
    if (msg.type === "delta") {
      if (!streamingBubble) {
        clearTyping();
        streamingBubble = addMsg("assistant", "");
      }
      streamingBubble.textContent += msg.text;
      smartScroll();
    }
    if (msg.type === "turn_done") {
      resetSendBtn();
      addTools(msg.stats.tools);
      if (msg.stats.decisions && msg.stats.decisions.length) {
        $("stTools").textContent = "决策卡 ×" + msg.stats.decisions.length;
      } else {
        $("stTools").textContent = msg.stats.tools.length ? `工具 ${msg.stats.tools.length} 次` : "无";
      }
      $("stTokens").textContent = msg.stats.estTokens ? `≈ ${msg.stats.estTokens} token` : "—";
    }
    if (msg.type === "card") renderCard(msg.card);
    if (msg.type === "roll_card") renderRollCard(msg.card);
    if (msg.type === "roll_result") onRollResult(msg.result);
    if (msg.type === "state") renderState(msg.state);
    if (msg.type === "notice") {
      const n = document.createElement("div");
      n.className = "warn";
      n.style.cssText = "white-space:pre-wrap;align-self:center;max-width:85%;";
      n.textContent = "⚙ " + msg.text;
      els.messages.appendChild(n);
      scrollDown();
    }
    if (msg.type === "reload") { location.reload(); }
    if (msg.type === "warn") { const w = document.createElement("div"); w.className = "warn"; w.textContent = msg.message; els.messages.appendChild(w); scrollDown(); }
    if (msg.type === "error") {
      resetSendBtn();
      const w = document.createElement("div"); w.className = "warn"; w.textContent = "⚠ " + msg.message; els.messages.appendChild(w); scrollDown();
    }
  };
  ws.onerror = () => {
    reconnectFailures++;
    if (reconnectFailures === 3 && !httpMode) {
      setHttpMode(true);
      // HTTP 模式开启后停止 WS 重连，改用 HTTP 轮询
      try { ws.close(); } catch {}
      httpPollState();
    }
  };
  ws.onclose = () => {
    if (busy) interrupted = true;
    busy = false; els.send.disabled = false; els.input.disabled = false;
    // 已切 HTTP 模式：不再重连 WS
    if (httpMode) return;
    // 连续失败 5 次后停止自动重连（Vercel 等无 WS 环境避免无限循环）
    if (reconnectFailures >= 5) return;
    setTimeout(connect, 1500);
  };
}

async function sendChat() {
  // busy 时按钮变“停止”：中断当前生成（关闭 WS 触发重连重置）
  if (busy) {
    stopGenerating();
    return;
  }
  const text = els.input.value.trim();
  if (!text) return;
  // 决策卡挂起时：普通输入当作自由选择（防止"没人点卡片 → 对话卡死"）
  if (cardEl) {
    wsSend({ type: "choice", text });
    clearCard();
    els.input.value = "";
    return;
  }
  if (busy) return;
  // 斜杠命令：不占用剧情回合，只发命令
  if (text.startsWith("/")) {
    els.input.value = "";
    if (httpMode) {
      void (async () => {
        const data = await httpSend({ type: "command", text });
        if (data.content) {
          const w = document.createElement("div"); w.className = "warn"; w.style.cssText = "white-space:pre-wrap;"; w.textContent = data.content; els.messages.appendChild(w); scrollDown();
        }
        httpPollState();
      })();
    } else {
      wsSend({ type: "command", text });
    }
    return;
  }
  busy = true; els.send.disabled = true;
  els.send.classList.add("busy");
  els.send.textContent = "停止";
  els.send.style.color = "var(--err)";
  els.send.style.border = "1px solid var(--err)";
  els.send.disabled = false;
  els.input.value = "";
  addMsg("user", text);
  // 打字指示器：AI 思考/生成期间显示三点跳动，首个 delta 到达时替换
  const typing = document.createElement("div");
  typing.className = "msg assistant typing";
  typing.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
  els.messages.appendChild(typing);
  hideEmptyTip();
  scrollDown();
  if (httpMode) {
    // HTTP 模式：等待完整返回后一次性渲染
    void (async () => {
      const data = await httpSend({ type: "chat", text });
      clearTyping();
      if (data.ok) {
        const body = addMsg("assistant", data.content || "（本轮无正文）");
        body.style.animation = "none";
      } else {
        const w = document.createElement("div"); w.className = "warn"; w.textContent = "⚠ " + (data.error || "请求失败"); els.messages.appendChild(w);
      }
      resetSendBtn();
      httpPollState();
    })();
    return;
  }
  wsSend({ type: "chat", text });
  // WS 消息超时检测：90s 无响应（Vercel WS 数据不通）则切 HTTP 重发
  if (wsTurnTimer) clearTimeout(wsTurnTimer);
  wsTurnTimer = setTimeout(() => {
    if (busy && !httpMode) {
      console.warn("[ws] 回合 90s 无响应，切 HTTP 模式");
      setHttpMode(true);
      try { ws.close(); } catch {}
      resetSendBtn();
      // HTTP 重发同一句
      els.input.value = text;
      sendChat();
    }
  }, 90000);
}

/* 停止生成：关 WS 触发重连重置（服务端无 interrupt 时的降级） */
function stopGenerating() {
  try { ws.close(); } catch {}
  resetSendBtn();
  connect();
}

els.send.onclick = sendChat;
els.input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });

// 快捷命令栏：点击即发命令
for (const btn of document.querySelectorAll("#quickCmd button")) {
  btn.onclick = () => {
    const cmd = btn.dataset.cmd || "";
    if (cmd === "/lore ") {
      // /lore 需要参数：把命令填入输入框，让玩家补关键词
      els.input.value = "/lore ";
      els.input.focus();
      return;
    }
    if (busy) return;
    if (httpMode) { void (async () => { const d = await httpSend({ type: "command", text: cmd }); if (d.content) { const w = document.createElement("div"); w.className = "warn"; w.style.cssText = "white-space:pre-wrap;"; w.textContent = d.content; els.messages.appendChild(w); scrollDown(); } httpPollState(); })(); }
    else wsSend({ type: "command", text: cmd });
  };
}

els.uploadBtn.onclick = () => els.cardFile.click();
$("snapBtn").onclick = saveSnapshot;

// 导出菜单：点击下载 md/doc
const exportBtn = $("exportBtn");
const exportMenu = $("exportMenu");
exportBtn.onclick = (e) => { e.stopPropagation(); exportMenu.style.display = exportMenu.style.display === "none" ? "block" : "none"; };
document.addEventListener("click", () => { exportMenu.style.display = "none"; });
for (const b of exportMenu.querySelectorAll("button")) {
  b.onclick = async () => {
    const fmt = b.dataset.fmt || "md";
    exportMenu.style.display = "none";
    try {
      const res = await fetch(`/api/export?fmt=${fmt}`);
      if (!res.ok) { alert("导出失败"); return; }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fmt === "md" ? "rp-dialog.md" : "rp-dialog.doc";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    } catch { alert("导出失败"); }
  };
}
$("newBtn").onclick = () => {
  if (!confirm("新建对话？当前剧情、账本与主线进度将被清空（角色卡保留）。建议先存档。")) return;
  if (httpMode) { void (async () => { await httpSend({ type: "command", text: "/new" }); location.reload(); })(); }
  else wsSend({ type: "command", text: "/new" });
};
els.cardFile.onchange = async () => {
  const f = els.cardFile.files[0];
  if (!f) return;
  let body;
  if (/\.png$/i.test(f.name)) {
    const buf = await f.arrayBuffer();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
    body = JSON.stringify({ pngBase64: b64 });
  } else {
    body = await f.text();
  }
  const res = await fetch("/api/card", { method: "POST", headers: { "Content-Type": "application/json" }, body });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "导入失败"); return; }
  els.messages.innerHTML = "";
  if (data.firstMes) addMsg("assistant", data.firstMes);
  const st = await (await fetch("/api/state")).json();
  renderState(st);
  $("chipCard").textContent = "角色：" + data.name;
};
connect();
</script>
</body>
</html>
